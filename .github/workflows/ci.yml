name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Format
        run: cargo fmt -- --check
        working-directory: quantlib-rs
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
        working-directory: quantlib-rs
      - name: Test
        run: cargo test --all
        working-directory: quantlib-rs

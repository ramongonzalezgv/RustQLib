name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Build benches
        run: cargo bench --workspace --no-run

  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build and install wheel
        run: |
          python -m venv .venv
          .venv/bin/pip install maturin numpy pytest
          VIRTUAL_ENV=.venv PATH=.venv/bin:$PATH maturin develop --release -m quantlib_py/Cargo.toml
      - name: Test
        run: .venv/bin/python -m pytest -q quantlib_py/tests

  web:
    name: WASM + web playground
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Clippy (wasm32)
        run: cargo clippy -p quantlib_wasm --target wasm32-unknown-unknown --all-targets -- -D warnings
      - name: WASM tests (Node)
        run: npx wasm-pack test --node ../quantlib_wasm
      - name: Build (wasm-pack + tsc + vite)
        run: npm run build
      - name: Browser smoke test
        run: |
          npx playwright install --with-deps chromium
          npm run smoke

[package]
name = "quantlib_engines"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
quantlib_core = { path = "../quantlib_core" }
quantlib_models = { path = "../quantlib_models" }
quantlib_products = { path = "../quantlib_products" }
rayon = "1.10"
num-complex = "0.4"
rustfft = "6.2"
rand = { version = "0.9", default-features = false, features = ["std"] }
rand_distr = { version = "0.5", default-features = false, features = ["std", "std_math"] }
rand_xoshiro = "0.7"

[dev-dependencies]
criterion = "0.5"
proptest = "1"

[[bench]]
name = "fft_bench"
harness = false

[[bench]]
name = "mc_bench"
harness = false

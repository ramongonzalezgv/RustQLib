<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Price options in the browser with RustQLib compiled to WebAssembly: compare engines, plot payoffs, Monte Carlo paths and implied-vol smiles." />
    <title>RustQLib Playground</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Cpath d='M6 22c4 0 5-12 10-12s6 8 10 8' stroke='white' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3C/svg%3E" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="8" />
          <path d="M6 22c4 0 5-12 10-12s6 8 10 8" />
        </svg>
        <div>
          <div class="brand-name">RustQLib</div>
          <div class="brand-sub">Pricing playground · Rust → WebAssembly</div>
        </div>
      </div>
      <div class="topbar-actions">
        <button id="share" class="btn btn-ghost" type="button" title="Copy a link to these inputs">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a5 5 0 0 0 7.07 0l3-3a5 5 0 0 0-7.07-7.07l-1 1M14 10a5 5 0 0 0-7.07 0l-3 3a5 5 0 0 0 7.07 7.07l1-1"/></svg>
          <span>Share</span>
        </button>
        <a class="btn btn-ghost" href="https://github.com/ramongonzalezgv/RustQLib" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 19c-4.3 1.4-4.3-2.5-6-3m12 5v-3.5c0-1 .1-1.4-.5-2 2.8-.3 5.5-1.4 5.5-6a4.6 4.6 0 0 0-1.3-3.2 4.2 4.2 0 0 0-.1-3.2s-1.1-.3-3.5 1.3a12.3 12.3 0 0 0-6.2 0C6.5 2.8 5.4 3.1 5.4 3.1a4.2 4.2 0 0 0-.1 3.2A4.6 4.6 0 0 0 4 9.5c0 4.6 2.7 5.7 5.5 6-.6.6-.6 1.2-.5 2V21"/></svg>
          <span>GitHub</span>
        </a>
      </div>
    </header>

    <main class="layout">
      <aside class="panel inputs" id="inputs" aria-label="Inputs"></aside>

      <section class="content">
        <div id="notice" class="notice" hidden></div>

        <div class="card hero">
          <div>
            <div class="eyebrow" id="hero-label">Price</div>
            <div class="hero-price" id="hero-price">—</div>
          </div>
          <dl class="hero-facts" id="hero-facts"></dl>
        </div>

        <div class="card">
          <div class="card-head">
            <h2>Engines</h2>
            <span class="muted small" id="engine-caption"></span>
          </div>
          <div class="table-wrap">
            <table class="engines">
              <thead>
                <tr>
                  <th>Engine</th>
                  <th class="num">Price</th>
                  <th class="num">vs reference</th>
                  <th class="num col-time">Time</th>
                </tr>
              </thead>
              <tbody id="engine-rows"></tbody>
            </table>
          </div>
        </div>

        <div class="card">
          <div class="card-head tabs-head">
            <div class="tabs" role="tablist" id="tabs">
              <button role="tab" data-tab="payoff" aria-selected="true">Payoff</button>
              <button role="tab" data-tab="paths" aria-selected="false">MC paths</button>
              <button role="tab" data-tab="smile" aria-selected="false">Vol smile</button>
            </div>
            <span class="muted small" id="chart-caption"></span>
          </div>
          <div class="chart-wrap">
            <div id="chart" class="chart"></div>
            <div id="chart-empty" class="chart-empty" hidden></div>
            <div id="chart-busy" class="chart-busy" hidden><span class="spinner"></span></div>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer muted small">
      All pricing runs locally in your browser via WebAssembly. Nothing is sent to a server.
    </footer>

    <div id="toast" class="toast" role="status" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

[package]
name = "quantlib_wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WebAssembly bindings for the RustQLib pricing playground"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
quantlib_core = { path = "../quantlib_core" }
quantlib_models = { path = "../quantlib_models" }
quantlib_products = { path = "../quantlib_products" }
quantlib_engines = { path = "../quantlib_engines" }
serde = { version = "1", features = ["derive"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"

[dev-dependencies]
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
